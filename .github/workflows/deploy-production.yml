name: Deploy → Production

# ─── Triggers ─────────────────────────────────────────────────────────────────
# 1. Push to main: deploy the latest commit (no staging anymore)
# 2. Push a version tag:  git tag v1.2.0 && git push origin v1.2.0
# 3. Manual trigger in GitHub Actions UI (workflow_dispatch)
#
# All paths require a human approval in the GitHub "production" Environment
# before the SSH deploy command actually runs.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.0.0, v2.3.1

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy (e.g. main, v1.2.0)"
        required: true
        default: main
      reason:
        description: "Reason for manual deploy"
        required: false

jobs:

  # ── 1. Always run tests before touching production ────────────────────────────
  test:
    name: Test Suite
    uses: ./.github/workflows/_test.yml

  # ── 2. Deploy to production ───────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest

    # ⚠️  REQUIRES SETUP IN GITHUB:
    # Repo → Settings → Environments → production → Required reviewers
    # Add yourself (or your team) as a required reviewer.
    # The workflow pauses here until someone clicks "Approve" in the UI.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve deploy ref
        id: ref
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          echo "Deploying ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Deploy to production droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          port:     ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/san-queue

            # ─── Capture the currently-deployed SHA BEFORE we change anything ───
            # Needed by the rollback path below. We use the commit SHA (not the
            # tag/branch name) because tags can be moved and branches advance —
            # the SHA pinpoints exactly the version that was running.
            PREVIOUS_SHA=$(git rev-parse HEAD)
            echo "── Previous version: $PREVIOUS_SHA ──"

            echo "── Pulling ref: ${{ steps.ref.outputs.ref }} ──"
            git fetch --tags origin
            # Use reset --hard directly (instead of checkout + reset) so any
            # uncommitted local drift on the droplet — e.g. emergency hotfix
            # scp'd before this commit hit git — is wiped cleanly. The target
            # ref is the source of truth.
            git reset --hard ${{ steps.ref.outputs.ref }}
            # Remove untracked files / dirs too so the working tree exactly
            # matches the committed state.
            git clean -fd

            NEW_SHA=$(git rev-parse HEAD)
            echo "── New version: $NEW_SHA ──"

            # ─── Rollback helper ─────────────────────────────────────────────────
            # Restores the previous SHA, rebuilds the image, and waits for /health.
            # Called on migration failure OR health-check timeout. Migrations only
            # add columns (never drop), so reverting code to PREVIOUS_SHA is safe
            # even if new migrations already ran — old code ignores new columns.
            rollback() {
              echo "── Rolling back to $PREVIOUS_SHA ──"
              git reset --hard "$PREVIOUS_SHA"
              git clean -fd
              docker compose up -d --build --no-deps app
              for i in $(seq 1 12); do
                STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
                if [ "$STATUS" = "200" ]; then
                  echo "✓ Rolled back successfully — production restored to $PREVIOUS_SHA"
                  return 0
                fi
                echo "  rollback health-check waiting… (${i}/12)"
                sleep 5
              done
              echo "⚠ Rollback rebuild started but health check did NOT recover"
              echo "⚠ Manual intervention required — SSH in and inspect"
              docker compose logs --tail=80 app
              return 1
            }

            echo "── Running database migrations ──"
            if ! docker compose run --rm app node -e "
              process.env.DATABASE_SSL = 'false';
              const knex = require('knex')(require('./knexfile').production);
              knex.migrate.latest()
                .then(([batch, files]) => {
                  if (files.length) console.log('Ran:', files.join(', '));
                  else console.log('Already up to date.');
                  process.exit(0);
                })
                .catch(e => { console.error(e.message); process.exit(1); });
            "; then
              echo "✗ Migrations failed — rolling back"
              rollback || true
              exit 1
            fi

            echo "── Rebuilding and restarting app ──"
            docker compose up -d --build --no-deps app

            echo "── Health check ──"
            for i in $(seq 1 18); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✓ Production healthy after ${i}x5s — deploy of $NEW_SHA complete"
                exit 0
              fi
              echo "  waiting… (${i}/18)"
              sleep 5
            done

            echo "✗ Health check timed out — rolling back"
            docker compose logs --tail=60 app
            rollback || true
            exit 1

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deploy complete"
          echo "   Ref: ${{ steps.ref.outputs.ref }}"
          echo "   URL: ${{ vars.PRODUCTION_URL }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Production deploy FAILED"
          echo "   Ref: ${{ steps.ref.outputs.ref }}"
