  <circle cx="208" cy="420" r="8" fill="#00C2D4" opacity="0.6"/>
  <circle cx="240" cy="420" r="8" fill="#00C2D4" opacity="0.4"/>
  <circle cx="272" cy="420" r="8" fill="#00C2D4" opacity="0.25"/>
  <circle cx="304" cy="420" r="8" fill="#00C2D4" opacity="0.15"/>
  <circle cx="336" cy="420" r="8" fill="#00C2D4" opacity="0.08"/>
</svg>
