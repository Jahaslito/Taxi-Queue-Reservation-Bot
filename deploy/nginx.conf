# ─── SAN Queue — nginx config ─────────────────────────────────────────────────
# Place at: /etc/nginx/sites-available/san-queue
# Enable:   sudo ln -s /etc/nginx/sites-available/san-queue /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain (e.g. sanqueue.yourdomain.com)
# SSL certs are managed by Certbot — run after enabling this file.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot challenge location (do not remove)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    # ── SSL (managed by Certbot — paths filled in automatically) ──────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Client body size (for profile updates, etc.) ──────────────────────────
    client_max_body_size 5M;

    # ── SSE streams — must NOT be buffered ───────────────────────────────────
    # /api/admin/watchlist/stream and /api/admin/monitor/stream are long-lived
    # SSE connections. proxy_buffering must be off and timeout must be long.
    location ~* ^/api/admin/(watchlist|monitor)/stream$ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-specific: no buffering, long timeout, no caching
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;   # 1 hour — SSE connections are long-lived
        proxy_send_timeout     3600s;
        proxy_connect_timeout  10s;

        # Tell nginx not to close the connection when the client is idle
        keepalive_timeout      3600s;

        # Disable gzip for SSE (chunked text/event-stream doesn't benefit)
        gzip off;
    }

    # ── All other requests ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;

        # Cache static assets at the nginx layer
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            proxy_pass http://127.0.0.1:3000;
            expires    7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
