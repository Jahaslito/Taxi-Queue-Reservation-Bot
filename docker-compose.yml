# ─── SAN Queue — Docker Compose (DigitalOcean Droplet) ───────────────────────
# Runs the full stack: app + postgres on a single droplet.
# nginx + SSL run on the HOST (not in Docker) — see deploy/nginx.conf.
#
# Usage:
#   docker compose up -d          # start
#   docker compose logs -f app    # tail logs
#   docker compose restart app    # hot-restart after code change
#   docker compose down           # stop everything
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       san_queue
      POSTGRES_USER:     san_queue
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # set in .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # Not exposed to the host — app talks to it on the internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U san_queue -d san_queue"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Guarantee Postgres a FLOOR of RAM (reservation) so an app spike can't
    # starve it, plus a hard ceiling so the app can safely run more Chromiums.
    #
    # ⚠️ 2026-07-28 — capped at 1 GB (was uncapped). Verified safe: this is stock
    # postgres:16-alpine (no tuning) driving a light OLTP queue workload (only 2
    # heavy query patterns in the codebase). Live idle RSS was 107 MiB; the worst
    # realistic stack — post-storm autovacuum (maintenance_work_mem 64M × ~3
    # workers ≈ 192M) + 20 pool backends × work_mem + shared_buffers 128M —
    # totals well under 500 MB, so 1 GB is ~2× headroom. pg_dump streams (it does
    # NOT balloon server RSS), so the old "nightly dump burst" fear doesn't hold
    # here. CAVEAT: queue_snapshots and logs have no retention yet — a pruning
    # migration keeps this ceiling true long-term (tracked separately). If the db
    # ever nears this cap, add retention first; do NOT quietly raise the cap.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  # ── App (Node.js + Playwright) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"   # only accessible from localhost — nginx proxies in
    environment:
      NODE_ENV:     production
      PORT:         3000

      # Database — points at the internal 'db' service; SSL not needed on same host
      DATABASE_URL: postgresql://san_queue:${DB_PASSWORD}@db:5432/san_queue
      DATABASE_SSL: "false"

      # Secrets — all sourced from .env on the droplet
      JWT_SECRET:       ${JWT_SECRET}
      ENCRYPTION_KEY:   ${ENCRYPTION_KEY}
      ADMIN_PASSWORD:   ${ADMIN_PASSWORD}

      # App URL (used in password-reset emails)
      APP_URL:          ${APP_URL}
      ALLOWED_ORIGIN:   ${APP_URL}

      # Email (Resend)
      RESEND_API_KEY:   ${RESEND_API_KEY:-}
      EMAIL_FROM:       ${EMAIL_FROM:-SAN Queue <noreply@sanqueue.com>}

      # Web Push (VAPID) — driver dispatch notifications + admin SOS alerts.
      # Generate once with `npx web-push generate-vapid-keys`; never rotate
      # without forcing all subscribers to re-enroll.
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:admin@sanqueue.com}

      # SMS (Telnyx) — driver dispatch SMS notifications.
      TELNYX_API_KEY:     ${TELNYX_API_KEY:-}
      TELNYX_FROM_NUMBER: ${TELNYX_FROM_NUMBER:-}

      # Stripe billing
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID:        ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      # Free-trial length for NEW sign-ups, in days. Unset/0 = NO free trial
      # (card charged at Checkout). Set to 14 to restore the classic 14-day
      # trial — no code deploy needed.
      TRIAL_PERIOD_DAYS:      ${TRIAL_PERIOD_DAYS:-0}
      # Epoch (seconds) until which new sign-ups get an extended trial that
      # clears the existing-subscriber pause window. Leave unset for normal
      # billing — empty string parses to 0. Only affects sign-ups when a trial
      # is enabled (TRIAL_PERIOD_DAYS>0). Paired with scripts/pause-subscriptions.js.
      STRIPE_PAUSE_UNTIL:     ${STRIPE_PAUSE_UNTIL:-}
      BILLING_ENABLED:        ${BILLING_ENABLED:-true}

      # Monitor tuning (optional — defaults apply if not set)
      MONITOR_POLL_MS:              ${MONITOR_POLL_MS:-30000}
      MONITOR_REFRESH_MS:           ${MONITOR_REFRESH_MS:-300000}
      MONITOR_CONCURRENCY:          ${MONITOR_CONCURRENCY:-3}
      MONITOR_START_HOUR:           ${MONITOR_START_HOUR:-5}
      MONITOR_END_HOUR:             ${MONITOR_END_HOUR:-23}
      MONITOR_POS_START_HOUR:       ${MONITOR_POS_START_HOUR:-3}
      MONITOR_POS_END_HOUR:         ${MONITOR_POS_END_HOUR:-23}
      MONITOR_MAX_TERMINAL_CHECKS:  ${MONITOR_MAX_TERMINAL_CHECKS:-5}
      # Storm-watch window (PT hours, all days). WIDENED 2026-07-27 from the old
      # fixed 4:00–5:30 to 3:00–8:00 so an early (July onsets ~04:00), late
      # (Sunday peaks ~05:40, some 06:44), or shifted storm is never caught at the
      # slow cadence. Affordable because the 1 s poll inside is ACTIVITY-GATED: 1 s
      # (BURST_POLL_MS) only while the queue is moving; BURST_IDLE_POLL_MS through
      # the calm + post-storm plateau. Governs prearm readiness + zero-buffer burst
      # drift too. Narrow it here if SAN ever rate-limits the sustained polling.
      MONITOR_BURST_START_HOUR:     ${MONITOR_BURST_START_HOUR:-3}
      MONITOR_BURST_END_HOUR:       ${MONITOR_BURST_END_HOUR:-8}
      MONITOR_BURST_POLL_MS:        ${MONITOR_BURST_POLL_MS:-1000}
      MONITOR_BURST_IDLE_POLL_MS:   ${MONITOR_BURST_IDLE_POLL_MS:-5000}
      # MASTER FAIL-SAFE for the 2026-07-27 cadence/prearm changes. Set to 0 to
      # revert to the pre-change behavior — 1 s poll locked across the whole
      # window + every waiting driver pre-armed across it (no activity-gating, no
      # early release). Flip this (no code deploy) if the smart logic is ever
      # suspected of missing or delaying a fire; it trades SAN load for readiness.
      MONITOR_SMART_CADENCE:        ${MONITOR_SMART_CADENCE:-true}
      MONITOR_EMERGENCY_SURGE_RATE: ${MONITOR_EMERGENCY_SURGE_RATE:-0.5}
      MONITOR_SAFETY_BUFFER_MS:     ${MONITOR_SAFETY_BUFFER_MS:-10000}
      MONITOR_QUEUE_URL:            ${MONITOR_QUEUE_URL}
      MONITOR_T1_URL:               ${MONITOR_T1_URL}
      MONITOR_T2_URL:               ${MONITOR_T2_URL}

      # Red-zone (SAN "not authorized") auto-remove. When a cab is benched by SAN
      # it shows in V Holding as class="notauthorized" (red) — visible but blocked.
      # ENABLED → the monitor auto-runs the "Remove From Queue" bot so the cab is
      # pulled out (free to rejoin) without the driver touching SAN, then verifies
      # on the next poll. Safe re: the 2026-06-15 strand (never mutates carryover/
      # hasBeenSeen flags). COOLDOWN + MAX_PER_DAY bound the ~00:00 churn, since SAN
      # re-lists a removed cab within seconds. Set ENABLED=false to kill instantly.
      MONITOR_REDZONE_AUTO_REMOVE_ENABLED: ${MONITOR_REDZONE_AUTO_REMOVE_ENABLED:-true}
      MONITOR_REDZONE_REMOVE_COOLDOWN_MS:  ${MONITOR_REDZONE_REMOVE_COOLDOWN_MS:-90000}
      MONITOR_REDZONE_REMOVE_MAX_PER_DAY:  ${MONITOR_REDZONE_REMOVE_MAX_PER_DAY:-6}

      # Proxy — routes ALL SAN traffic (polling + bot) through the same IP
      # Leave unset to use the droplet's own IP
      PROXY_SERVER:   ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}

      # Proxy circuit breaker / kill switch (proxyHealthService)
      # PROXY_ENABLED=false → skip proxy entirely (observation mode)
      # PROXY_FAIL_THRESHOLD → consecutive failures before tripping the breaker
      # PROXY_COOLDOWN_MS    → ms to stay direct after a trip (5 min default)
      PROXY_ENABLED:         ${PROXY_ENABLED:-true}
      PROXY_FAIL_THRESHOLD:  ${PROXY_FAIL_THRESHOLD:-3}
      PROXY_COOLDOWN_MS:     ${PROXY_COOLDOWN_MS:-300000}

      # Session warmer (sessionWarmerService)
      WARMER_ENABLED:        ${WARMER_ENABLED:-true}
      WARMER_MORNING_CRON:   ${WARMER_MORNING_CRON:-0 3 * * *}
      WARMER_REFRESH_CRON:   ${WARMER_REFRESH_CRON:-0 6,9,12,15,18,21 * * *}
      WARMER_CONCURRENCY:    ${WARMER_CONCURRENCY:-2}
      WARMER_STAGGER_MS:     ${WARMER_STAGGER_MS:-1000}
      WARMER_FRESH_MS:       ${WARMER_FRESH_MS:-7200000}

      # Position-scheduler tuning
      MONITOR_BIAS_CAP:      ${MONITOR_BIAS_CAP:-10}
      # ±10 accuracy contract — undershoot half. Hard ceiling on how many
      # positions EARLY a position fire may happen (drift + bias). See
      # POS_MAX_LEAD in monitorService for the full derivation.
      MONITOR_POS_MAX_LEAD:  ${MONITOR_POS_MAX_LEAD:-10}
      # SAN commit-latency awareness (2026-07-28). The drift horizon measures the
      # BOT's run time (decision → click) but was blind to SAN's own commit
      # latency (click → slot stamped). On the 07-27 storm that gap stalled to
      # 22–42 s as a ~34/s onset drained through the fire pool, so every pending
      # fire landed 150+ past target (overshoot ↔ commit latency r=0.869). We now
      # MEASURE that gap per fire and, when this is ON, fold its rolling median
      # into the horizon. NEVER relaxes the ±10 contract — the lead it feeds is
      # still clamped by POS_MAX_LEAD and growthLeadCap, so a full storm is
      # already pinned (no-op) and only moderate mornings tighten. DEFAULT OFF:
      # the instrumentation/logging runs regardless; flip to 1 only after a live
      # storm confirms the measured latencies look sane in the logs.
      MONITOR_COMMIT_LATENCY_LEAD:  ${MONITOR_COMMIT_LATENCY_LEAD:-false}
      # ±10 accuracy contract — overshoot half. Pre-armed fire sessions park a
      # logged-in page on SAN's "Add To Queue" screen for drivers near their
      # fire window, making the fire a ~1 s click (vs ~3.5 s cold launch) with
      # no bot-queue wait. Memory: BOT_ARMED_BROWSERS shared Chromiums
      # (~180 MB each) + ~35 MB per armed driver — 40 armed on 3 browsers
      # ≈ 2 GB worst case, inside the 4096M limit below alongside
      # MONITOR_CONCURRENCY cold bots. BOT_ARMED_MAX must cover the WHOLE
      # day's position roster: a chunk storm fires everyone on one tick, and
      # unarmed drivers fall to the cold path at peak burst (2026-06-30: the
      # old cap of 10 left 7 drivers cold → landings +46…+127 past target).
      MONITOR_PREARM_ENABLED:    ${MONITOR_PREARM_ENABLED:-true}
      MONITOR_PREARM_AHEAD_SECS: ${MONITOR_PREARM_AHEAD_SECS:-240}
      # Fleet-wide dynamic prearm lead (2026-07-27). The whole fleet arms when the
      # queue starts MOVING toward the day's earliest target, or that earliest
      # target is projected within this many seconds of being reached — replacing
      # the old "arm for the whole burst window" rule that held sessions warm
      # through the idle pre-storm hour and post-storm plateau. 20 min is a
      # generous lead (arming takes seconds) so no driver ever fires cold.
      MONITOR_PREARM_LEAD_SECS:  ${MONITOR_PREARM_LEAD_SECS:-1200}
      # Wall-clock prearm floor (2026-07-28, deliberate safety margin): the whole
      # fleet is armed from this PT time no matter what the projections say — a
      # deterministic "armed by" guarantee layered OVER the dynamic triggers
      # above, which can still arm earlier on movement (never later). 03:20 gives
      # ~40 min before the earliest onset ever observed (04:00; onsets drifting
      # ~7 min/wk earlier through July — move this up if the trend continues).
      # Window-bounded so the fleet is not held armed all day. 'HH:MM' PT;
      # malformed values fall back to 03:30.
      MONITOR_PREARM_CLOCK_PT:   ${MONITOR_PREARM_CLOCK_PT:-03:20}
      # Arm every waiting driver once the queue reaches this position — bursts
      # are position-locked, so proximity in POSITION, not projected fire time,
      # is what predicts the storm.
      # ⚠️ 2026-07-28 — 45→22: July storms now BEGIN at queue 26–36 (was 44–55 in
      # June), so the 45 backstop armed only after the storm had started. 22 sits
      # just under the July onset floor (26). Cost is only session-hours (arming
      # never fires anyone); the dynamic prearm (movement / 20-min lead) usually
      # beats this backstop anyway. Track the regime — see ZONE_MIN note above.
      MONITOR_PREARM_QUEUE_POS:  ${MONITOR_PREARM_QUEUE_POS:-22}
      # De-lag (fleet-landing true-tail probe). THE consumer of the tail/borrow
      # probe samples: fires drivers on our own fleet's live landings (now also
      # fed early by the fire-visibility watch) when SAN's ~5 s stepped display
      # is stale. Contract-safe (effectiveQueue clamped to a true-tail lower
      # bound — pure computation, no side effects). DEFAULT ON as of 2026-07-20:
      # it was silently OFF on the 07-20 storm (0 activations) which cost the
      # ramp-portion de-lag; it delivered the 07-04 early-cluster wins and never
      # spends undershoot. Confirm the droplet .env does NOT override it to 0.
      MONITOR_FLEET_PROBE:          ${MONITOR_FLEET_PROBE:-1}
      MONITOR_FLEET_PROBE_FRESH_MS: ${MONITOR_FLEET_PROBE_FRESH_MS:-8000}
      MONITOR_FLEET_PROBE_MAX_LEAD: ${MONITOR_FLEET_PROBE_MAX_LEAD:-40}
      # Storm-onset early fire (07-08: competitor batch jumped 66→105 in one
      # 5s render tick — every target in the gap fired born-over, +32…+50).
      # Fires corridor drivers BEFORE the chunk when the onset signature shows
      # (queue in zone + rate/step), spending bounded undershoot (≤ ONSET_CAP
      # positions, enforced against a proven tail lower bound) to kill the
      # unbounded overshoot. '0' off | 'shadow' log-only (run a morning first,
      # grep ONSET-SHADOW) | '1' live.
      # Ramp-tuned thresholds (07-10/07-11 forensics: both storms' trigger
      # steps happened BELOW the old zone floor 55 / step 8 — onset armed 6-11s
      # late, at the 12-15/s peak instead of the ramp). Calm mornings are
      # protected by the DYNAMIC cap: allowance = min(CAP, max(10, 2×biggest
      # recent render step)) — a lone +5 flurry unlocks only ~10 early (normal
      # lead, no extra undershoot); real chunks unlock the full cap in one
      # render. QUIET_MS replaces the retired MONITOR_ONSET_QUIET_TICKS (the
      # detector is render-aware now; delete QUIET_TICKS from .env if present).
      # DEFAULT ON as of 2026-07-20: live + proven since 07-10 (07-12 storm ran
      # it 100% armed / 0 cold). Set to 'shadow' or '0' in .env only to A/B a
      # change. The 07-19 backlog package (CAP_MAX/horizon guard below) is a
      # no-op unless this is live.
      MONITOR_ONSET_FIRE:        ${MONITOR_ONSET_FIRE:-1}
      # ⚠️ 2026-07-28 — ZONE_MIN 40→20: the storm regime moved out from under the
      # old floor. 57-day re-analysis: July onsets begin at queue 26–36 (20 of 21
      # days BELOW 40), so at 40 the detector could not arm until the storm was
      # already a chunk past its start. Safe by the calm-guard: 9-week replay
      # found pre-storm flurries in the 20–40 band on 37/57 days but their worst
      # step was +5 ⇒ dynamic cap = max(10, 2×step) = 10 on every one — identical
      # to the normal lead, no extra undershoot, no overshoot vector (onset fires
      # only land EARLY). Zone-20 catches the leading edge on 45/57 days.
      # Regime is still drifting — recalibrate from the last ~10 storms' onset
      # levels if overshoot medians rise again (see storm-dow re-analysis 07-28).
      MONITOR_ONSET_ZONE_MIN:    ${MONITOR_ONSET_ZONE_MIN:-20}
      MONITOR_ONSET_ZONE_MAX:    ${MONITOR_ONSET_ZONE_MAX:-90}
      MONITOR_ONSET_RATE:        ${MONITOR_ONSET_RATE:-1.2}
      MONITOR_ONSET_STEP:        ${MONITOR_ONSET_STEP:-5}
      MONITOR_ONSET_CAP:         ${MONITOR_ONSET_CAP:-25}
      MONITOR_ONSET_QUIET_MS:    ${MONITOR_ONSET_QUIET_MS:-25000}
      # Backlog-aware onset cap + target-horizon guard (07-19 five-morning
      # forensics; see monitorService ONSET_CAP_MAX block). The onset cap may
      # deepen past the dynamic base up to CAP_MAX, but ONLY while a real SAN
      # processing backlog is proven live: display slope × age of the oldest
      # in-flight fire NOT yet visible in V Holding (visibility separates true
      # backlog from WAIT-screen stream-back lag — deepening on confirm latency
      # alone undershoots −19…−26 in replay). Targets above SAFE_HORIZON get at
      # most MID_CAP; above MID_HORIZON no onset early fire at all (storms die
      # at ~200–232; every onset undershoot breach was a target ≥196).
      # DEEP CAP RETIRED 2026-07-21 — default is now 25 (= ONSET_CAP). The
      # overshoot it fought is attacked at its source by the fast page release
      # (BOT_FIRE_RELEASE_MS) at ZERO undershoot cost, so firing the corridor
      # 26-45 early only carried undershoot risk (−44 on a stall). Set to 45 in
      # .env to re-enable if a future storm shows a genuine SAN-side backlog the
      # declog can't clear.
      MONITOR_ONSET_CAP_MAX:         ${MONITOR_ONSET_CAP_MAX:-25}
      MONITOR_ONSET_SAFE_HORIZON:    ${MONITOR_ONSET_SAFE_HORIZON:-170}
      MONITOR_ONSET_MID_HORIZON:     ${MONITOR_ONSET_MID_HORIZON:-200}
      MONITOR_ONSET_MID_CAP:         ${MONITOR_ONSET_MID_CAP:-15}
      MONITOR_ONSET_VIS_BASELINE_MS: ${MONITOR_ONSET_VIS_BASELINE_MS:-3500}
      # Growth-scaled lead: plain-rule lead additionally capped at
      # 2 + 3×growthRate — calm mornings stop spending the full lead-10 on
      # growth that never comes (the −11…−13 pre-storm class, 6 of 9 breaches
      # 07-15…07-19). No-op at burst rates. '0' disables.
      MONITOR_GROWTH_LEAD:           ${MONITOR_GROWTH_LEAD:-1}
      # Undershoot-rescue detector: 'shadow' (default) logs the moment a
      # below-band landing became rescuable (storm dead + tail back in band —
      # a remove + armed re-add would land in-band). Log-only; '0' silences.
      MONITOR_UNDER_RESCUE:          ${MONITOR_UNDER_RESCUE:-shadow}
      # Fire-visibility watch: one spacezone fetch per POLL_MS while armed
      # fires are in flight (the backlog signal + early landings above).
      BOT_FIRE_VIS_POLL_MS:          ${BOT_FIRE_VIS_POLL_MS:-1250}
      BOT_FIRE_VIS_START_MS:         ${BOT_FIRE_VIS_START_MS:-2000}
      BOT_FIRE_VIS_TIMEOUT_MS:       ${BOT_FIRE_VIS_TIMEOUT_MS:-60000}
      # Fast page release (2026-07-21 pipeline-declog). The old fire path held
      # each browser page in waitForFunction until SAN streamed the WAIT screen
      # back (10-25 s under storm load); with ~25 drivers now firing per queue
      # jump (fleet grew ~15→68), that jams the shared browsers and balloons
      # SAN's effective slot-latency 0.3 s→1.6 s = the entire +30→+50 overshoot
      # regression. Now: wait only this long for the WAIT screen; if it hasn't
      # rendered (the load case), release the browser immediately and confirm the
      # committed add via the V Holding read. Contract-safe — changes only HOW we
      # confirm, never WHEN we fire. Raise it to keep more calm fires on the
      # in-page read; lower it to free the pipeline sooner during storms.
      # TUNED 2026-07-24 3000→1000: the 07-24 storm fired 29 drivers on one tick,
      # serialising ~4 deep across 7 browsers → 11 s tails → +48…+59 overshoot
      # (vs +32 first-out; the delta is pure per-browser hold). Under storm load
      # the WAIT screen takes 10-25 s to return, so the 3 s hold was wasted; 1 s
      # frees each browser ~3× sooner at zero undershoot cost.
      BOT_FIRE_RELEASE_MS:           ${BOT_FIRE_RELEASE_MS:-1000}
      # After a fast release, confirm the committed add via V Holding with a
      # longer window (12 × 1.5 s ≈ 18 s of lightweight HTTP, no held browser) so
      # a slow-to-appear add is never conceded to the cold fallback — which would
      # re-add and write "already in queue" to the Position Accuracy table. Only
      # a genuinely benched "Not Authorized" driver falls through (reported as
      # Not-Authorized, never "already in queue").
      BOT_FIRE_RELEASE_VERIFY_ATTEMPTS: ${BOT_FIRE_RELEASE_VERIFY_ATTEMPTS:-12}
      # ⚠️ 2026-07-28 — 40→48 to match the widened pool's slot capacity (12
      # browsers × 4 sessions below); at 40 the cap bound BELOW capacity, and on
      # 07-27 it starved 9 of 78 drivers (targets 111–165, the crush band) to the
      # cold path → landings +74…+154 past target. Keep this equal to
      # BOT_ARMED_BROWSERS_MAX × BOT_ARMED_SESSIONS_PER_BROWSER when resizing.
      BOT_ARMED_MAX:             ${BOT_ARMED_MAX:-48}
      # Roster-scaled armed pool: BOT_ARMED_BROWSERS is the FLOOR; one extra
      # browser opens per BOT_ARMED_SESSIONS_PER_BROWSER armed sessions, up to
      # BOT_ARMED_BROWSERS_MAX (07-06: 12 same-tick claims on 3 browsers = 4
      # serialized clicks each → 9.7 s per fire; ~36 armed now get 6 browsers
      # → ~2 clicks per browser in the same batch). Each extra browser costs
      # ~180 MB; MAX past 8 needs a matching pm2 max_memory_restart bump.
      #
      # ⚠️ 2026-07-28 — WIDENED to cut the 07-27 drain term (Lever 1). Same-tick
      # armed clicks serialise PER BROWSER on that browser's event loop, so
      # firing throughput scales with browser COUNT, not MONITOR_CONCURRENCY (the
      # armed path bypasses that jobQueue). On 07-27 the ARMED_MAX=40 roster on
      # 8 browsers = ~5 serialized clicks/browser feeding a ~34/s onset. Fewer
      # sessions per browser (6→4) forces the pool to open browsers earlier, and
      # a higher MAX (8→12) lands ~3–4 clicks/browser. Sized for the 8 GB droplet:
      # 12-browser worst-case RSS ≈ 4.1 GB, under the pm2 restart (4608M) with a
      # 512M graceful-restart gap below the Docker app cap (5120M). This became
      # affordable by capping co-located Postgres at 1 GB (see the db service; it
      # idles at 107 MiB) instead of leaving it uncapped. Box budget: 5 GB app +
      # 1 GB db + ~1 GB OS/nginx ≈ 7 GB of 7.75. Past 12 needs a bigger droplet —
      # verify with `docker stats` at ~10 browsers during a live storm first.
      BOT_ARMED_BROWSERS:             ${BOT_ARMED_BROWSERS:-4}
      BOT_ARMED_BROWSERS_MAX:         ${BOT_ARMED_BROWSERS_MAX:-12}
      BOT_ARMED_SESSIONS_PER_BROWSER: ${BOT_ARMED_SESSIONS_PER_BROWSER:-4}
      BOT_ARM_OPS_CONCURRENCY:   ${BOT_ARM_OPS_CONCURRENCY:-4}
      # Adaptive fire-confirmation timeout: floor .. max, driven by 2 × rolling
      # p95 of armed-fire durations. A timeout is verified against V Holding
      # before falling back cold — the Blazor add commits when SAN processes
      # the click, so a slow confirmation is almost never a failed add
      # (07-06: 17 committed adds misread as failures → "already in queue" wall).
      BOT_ARM_FIRE_TIMEOUT_MS:     ${BOT_ARM_FIRE_TIMEOUT_MS:-12000}
      BOT_ARM_FIRE_TIMEOUT_MAX_MS: ${BOT_ARM_FIRE_TIMEOUT_MAX_MS:-45000}
      # Persistent vehicle_not_available = broken SAN account/vehicle data
      # (the #142/#70/#4006 class): after N consecutive not-available arm
      # attempts, suspend re-arming that driver for the suspend window instead
      # of looping SAN logins every 180 s cooldown (06-30: 47 logins each for
      # #70/#4006 in one day).
      BOT_ARM_NOT_AVAIL_MAX:        ${BOT_ARM_NOT_AVAIL_MAX:-3}
      BOT_ARM_NOT_AVAIL_SUSPEND_MS: ${BOT_ARM_NOT_AVAIL_SUSPEND_MS:-21600000}
      BOT_ARM_REFRESH_MS:        ${BOT_ARM_REFRESH_MS:-90000}
      # Sacrificial tail probe (anti-straddle observation feed, default OFF).
      # Dedicated probe vehicle(s) run add → read slot → confirm-remove cycles
      # during the storm, feeding exact true-tail samples to the fleet probe —
      # the ~5 s stepped display can't show intra-chunk growth, the server's
      # own slot assignment can. Requires DEDICATED SAN account(s) (never a
      # real driver's) and one off-peak smoke cycle per account before first
      # storm use. SAMPLING CADENCE IS THE LEVER (5-day replay, pooled):
      # 1 probe ≈ 3.5 s → 88% of fires ≤ +15 (worst +27); 2 probes ≈ 1.8 s →
      # 94% ≤ +15 (worst +24); 3 probes ≈ 1.2 s → 96% ≤ +15 (worst +23).
      # Multiple probes: comma-separated ALIGNED lists in the three vars
      # (e.g. "9998,9999" / "userA,userB" / "passA,passB"); each probe gets
      # its own loop + browser, first cycles staggered so samples interleave.
      # MAX_CYCLES is PER PROBE (total SAN adds/day = cap × #probes).
      MONITOR_TAIL_PROBE:        ${MONITOR_TAIL_PROBE:-0}
      TAIL_PROBE_VEHICLE:        ${TAIL_PROBE_VEHICLE:-}
      TAIL_PROBE_SAN_USERNAME:   ${TAIL_PROBE_SAN_USERNAME:-}
      TAIL_PROBE_SAN_PASSWORD:   ${TAIL_PROBE_SAN_PASSWORD:-}
      TAIL_PROBE_MAX_CYCLES:     ${TAIL_PROBE_MAX_CYCLES:-150}
      TAIL_PROBE_STAGGER_MS:     ${TAIL_PROBE_STAGGER_MS:-1700}
      # Imminence gate: probe only while some pending fire is within this many
      # seconds. Storm days: secsToFire collapses in the burst zone, so the
      # probe runs continuously there. Calm days: short probe windows just
      # before each fire cluster instead of burning the cycle cap all morning.
      MONITOR_TAIL_PROBE_AHEAD_SECS: ${MONITOR_TAIL_PROBE_AHEAD_SECS:-90}
      # Borrowed tail probe (default OFF, and RECOMMENDED OFF after the
      # 2026-07-04 failure). Old design lent paying drivers on a global calm gate
      # and retired the whole roster only when the storm arrived — too late, so
      # near-target drivers fired born-over & cold (+61/+72/+85). FIXED 2026-07-22
      # with PER-DRIVER rate-aware retire: a driver is kept as a probe ONLY while
      # the queue is more than max(RETIRE_BUFFER, rate × RETIRE_LEAD_SECS) below
      # their target — i.e. while there is provably enough runway to remove +
      # re-arm before their fire. Drivers drop out one by one as the storm nears
      # their target; the strand is impossible by construction. This lets us probe
      # THROUGH the storm with far-target drivers. Default OFF — cycles a paying
      # account; enable only deliberately. PROBE_VEHICLE (4000) is borrowed first.
      MONITOR_BORROW_PROBE:            ${MONITOR_BORROW_PROBE:-0}
      MONITOR_BORROW_PROBE_VEHICLE:    ${MONITOR_BORROW_PROBE_VEHICLE:-4000}
      MONITOR_BORROW_RETIRE_BUFFER:    ${MONITOR_BORROW_RETIRE_BUFFER:-20}
      MONITOR_BORROW_RETIRE_LEAD_SECS: ${MONITOR_BORROW_RETIRE_LEAD_SECS:-30}
      MONITOR_BORROW_PROBE_MAX:        ${MONITOR_BORROW_PROBE_MAX:-2}
      MONITOR_BORROW_PROBE_MARGIN:     ${MONITOR_BORROW_PROBE_MARGIN:-60}
      # Emergency global kill only (per-driver retire is the real control):
      MONITOR_BORROW_STOP_QUEUE:       ${MONITOR_BORROW_STOP_QUEUE:-400}
      MONITOR_BORROW_STORM_RATE:       ${MONITOR_BORROW_STORM_RATE:-60}
      # Poll cache-buster — TESTED 2026-07-03, DON'T BOTHER: spacezone already
      # returns "cache-control: no-cache, no-store, max-age=0" (identical with
      # a buster param), so there is no intermediary cache; the ~5 s step is
      # SAN's own server-side render cadence. Kept only as a header knob.
      MONITOR_POLL_CACHE_BUST:   ${MONITOR_POLL_CACHE_BUST:-0}

      # Bot session disk persistence path (relative to /app inside container)
      BOT_SESSION_PERSIST_PATH: ${BOT_SESSION_PERSIST_PATH:-/app/data/bot-sessions.json}

      # Playwright screenshot dir (debug)
      BOT_DEBUG_DIR: /tmp/san-bot-debug

      # ── DB retention sweep (2026-07-28) ──────────────────────────────────────
      # Prunes the two UNBOUNDED tables (queue_snapshots ~18k rows/storm-day,
      # logs) so the 1 GB Postgres cap stays true long-term. position_tracking is
      # left alone (small; feeds bias/accuracy history). ON/OFF is pure env — flip
      # RETENTION_ENABLED and recreate the container, no code deploy. Default OFF.
      # Windows floor at 90 d to preserve the ~9-week storm-profile analytics;
      # set a table's *_DAYS to 0 to skip just that table. Batched deletes over
      # already-indexed age columns keep locks/WAL short on the capped db.
      RETENTION_ENABLED:               ${RETENTION_ENABLED:-false}
      RETENTION_QUEUE_SNAPSHOTS_DAYS:  ${RETENTION_QUEUE_SNAPSHOTS_DAYS:-90}
      RETENTION_LOGS_DAYS:             ${RETENTION_LOGS_DAYS:-90}
      RETENTION_BATCH_SIZE:            ${RETENTION_BATCH_SIZE:-5000}
      # Sweep cadence (ms). Default MONTHLY (30 d = 2592000000). The 90-day window
      # is a MOVING line so the sweep repeats; monthly holds the table at ≤~120 d
      # worst case — still well under the 1 GB cap. First run is ~60 s after boot,
      # then every interval. Not a wall-clock time — it's uptime-relative.
      RETENTION_SWEEP_INTERVAL_MS:     ${RETENTION_SWEEP_INTERVAL_MS:-2592000000}

      # ── Oracle-shadow daily report (2026-07-28) ──────────────────────────────
      # LOG-ONLY hindsight analysis, runs once a day after the position morning:
      # replays queue_snapshots + position_tracking through the three ceiling
      # models (independent oracle / fleet-constrained oracle / causal replay,
      # incl. the 'hardcap' candidate policy: depth-clamped early fire, born-over
      # guard, ≤+40 enforcement) and logs scorecards + the gap decomposition
      # (capacity vs observability vs implementation loss). Never touches live
      # decisions — grep '[OracleShadow]'. Feeds the ±10/≤+40 goal work.
      MONITOR_ORACLE_SHADOW:        ${MONITOR_ORACLE_SHADOW:-1}
      ORACLE_SHADOW_HOUR_PT:        ${ORACLE_SHADOW_HOUR_PT:-10}
      # Fleet-oracle click-start rate cap (clicks/s): ~10/s on the 12-browser
      # click path; raise after HTTP-fire is live.
      ORACLE_SHADOW_CLICKS_PER_SEC: ${ORACLE_SHADOW_CLICKS_PER_SEC:-8}

    volumes:
      - ./logs:/app/logs   # daily log files persist across container restarts
      - ./data:/app/data   # runtime state (bot latency samples, etc.) persists across restarts

    # Shared memory for Chromium (prevents crashes on small droplets)
    shm_size: '256mb'

    networks:
      - internal

    # Resource limits — sized for an 8 GB droplet (shared with the db service +
    # OS + host nginx). The app gets the bulk so it can run more pre-armed
    # Chromiums; the cap still contains a runaway-browser leak so it can't
    # OOM-kill Postgres. IMPORTANT: keep pm2's max_memory_restart
    # (ecosystem.config.js) BELOW this hard cap so pm2 restarts the app
    # gracefully before Docker's OOM killer fires. Was 1536M when the droplet
    # was 2 GB — raised 2026-06-16.
    #
    # ⚠️ 2026-07-28 — raised 4096M → 5120M for the 12-browser armed pool (Lever 1,
    # see BOT_ARMED_BROWSERS_MAX). Worst-case app RSS ≈ 4.1 GB; pm2 restarts at
    # 4608M (512M gap under this cap). Affordable because Postgres is now capped
    # at 1 GB (see the db service): box budget 5 GB app + 1 GB db + ~1 GB
    # OS/nginx ≈ 7 GB of 7.75. Do NOT raise further without shrinking that
    # headroom check — going past 12 browsers needs a bigger droplet.
    deploy:
      resources:
        limits:
          memory: 5120M
        reservations:
          memory: 1024M

volumes:
  pgdata:         # postgres data persists across container restarts
    driver: local

networks:
  internal:
    driver: bridge
