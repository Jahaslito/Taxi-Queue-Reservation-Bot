name: Deploy → Staging

# ─── Triggers ─────────────────────────────────────────────────────────────────
# Every push to main: run tests → deploy to staging droplet automatically.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

jobs:

  # ── 1. Tests must pass before any deploy ─────────────────────────────────────
  test:
    name: Test Suite
    uses: ./.github/workflows/_test.yml

  # ── 2. Deploy to staging ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest

    # GitHub Environment — add protection rules in repo Settings → Environments
    # (no approval required for staging — it deploys automatically)
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/san-queue

            # ─── Capture previously-running SHA for the rollback path ───────────
            # Mirrors deploy-production.yml so both workflows have consistent
            # behaviour. Migrations only add columns, never drop, so reverting
            # code is always safe even after migrations have already run.
            PREVIOUS_SHA=$(git rev-parse HEAD)
            echo "── Previous version: $PREVIOUS_SHA ──"

            echo "── Pulling latest code ──"
            git fetch origin
            # Reset directly instead of checkout + reset — handles any local
            # drift cleanly. Target ref is the source of truth.
            git reset --hard origin/main
            git clean -fd

            NEW_SHA=$(git rev-parse HEAD)
            echo "── New version: $NEW_SHA ──"

            # ─── Rollback helper ─────────────────────────────────────────────────
            rollback() {
              echo "── Rolling back staging to $PREVIOUS_SHA ──"
              git reset --hard "$PREVIOUS_SHA"
              git clean -fd
              docker compose up -d --build --no-deps app
              for i in $(seq 1 12); do
                STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
                if [ "$STATUS" = "200" ]; then
                  echo "✓ Rolled back successfully — staging restored to $PREVIOUS_SHA"
                  return 0
                fi
                echo "  rollback health-check waiting… (${i}/12)"
                sleep 5
              done
              echo "⚠ Rollback rebuild started but health check did NOT recover"
              echo "⚠ Manual intervention required — SSH in and inspect"
              docker compose logs --tail=80 app
              return 1
            }

            echo "── Running database migrations ──"
            if ! docker compose run --rm app node -e "
              process.env.DATABASE_SSL = 'false';
              const knex = require('knex')(require('./knexfile').production);
              knex.migrate.latest()
                .then(([batch, files]) => {
                  if (files.length) console.log('Ran:', files.join(', '));
                  else console.log('Already up to date.');
                  process.exit(0);
                })
                .catch(e => { console.error(e.message); process.exit(1); });
            "; then
              echo "✗ Migrations failed — rolling back"
              rollback || true
              exit 1
            fi

            echo "── Rebuilding and restarting app ──"
            docker compose up -d --build --no-deps app

            echo "── Health check ──"
            for i in $(seq 1 12); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✓ Staging healthy after ${i}x5s — deploy of $NEW_SHA complete"
                exit 0
              fi
              echo "  waiting… (${i}/12)"
              sleep 5
            done

            echo "✗ Health check timed out — rolling back"
            docker compose logs --tail=60 app
            rollback || true
            exit 1

      - name: Notify success
        if: success()
        run: echo "✅ Staging deploy complete — ${{ vars.STAGING_URL }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Staging deploy FAILED — check SSH logs above"
